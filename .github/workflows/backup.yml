name: Nightly database backup

on:
  schedule:
    # 18:00 UTC = 00:30 Asia/Yangon.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check the database secret
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add the Supabase session-pooler connection string (port 5432) as a repository secret."
            exit 1
          fi

      - name: Install the PostgreSQL 17 client
        # Supabase runs PostgreSQL 17 and pg_dump refuses to talk to a newer
        # server, so install the matching client instead of the runner default.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and compress
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges --format=custom --file="zaywear-$stamp.dump" "$DB_URL"
          gzip -9 "zaywear-$stamp.dump"
          ls -lh zaywear-*.dump.gz

      - name: Keep seven days of dumps
        uses: actions/upload-artifact@v4
        with:
          name: zaywear-db-${{ github.run_id }}
          path: zaywear-*.dump.gz
          retention-days: 7
